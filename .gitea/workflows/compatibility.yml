# Temporary implementation gate; removed after a real artifact round-trip.
name: Platform compatibility gate
on: workflow_dispatch
jobs:
  probe:
    runs-on: infrabox-platform
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: ${{ gitea.server_url }}
          persist-credentials: false
      - name: Create a tiny artifact and verify the checked out commit
        env:
          EXPECTED_SHA: ${{ gitea.sha }}
        run: |
          python3 -c 'import os,subprocess,pathlib; sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(); assert sha==os.environ["EXPECTED_SHA"]; pathlib.Path("compatibility.txt").write_text(sha+"\n")'
      - uses: https://github.com/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        with:
          name: platform-compatibility
          path: compatibility.txt
          if-no-files-found: error
          retention-days: 7
