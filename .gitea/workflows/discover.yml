name: Discover host facts
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Ansible host pattern (empty means all managed hosts)
        required: false
        type: string
jobs:
  discover:
    runs-on: infrabox-platform
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLATFORM_INTERFACE_EXCLUDE_PATTERNS: ${{ vars.PLATFORM_INTERFACE_EXCLUDE_PATTERNS || 'cilium_*,lxc*' }}
      PLATFORM_TARGETS: ${{ inputs.targets }}
      GITEA_SERVER_URL: ${{ gitea.server_url }}
      GITEA_REPOSITORY: ${{ gitea.repository }}
      GITEA_SHA: ${{ gitea.sha }}
      GITEA_RUN_ID: ${{ gitea.run_id }}
      GITEA_RUN_ATTEMPT: ${{ gitea.run_attempt }}
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      NETBOX_API: ${{ vars.NETBOX_API }}
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      PLATFORM_MANAGED_TAG: ${{ vars.PLATFORM_MANAGED_TAG }}
      PLATFORM_KV_MOUNT: ${{ vars.PLATFORM_KV_MOUNT }}
      PLATFORM_RESULTS_DIR: ${{ runner.temp }}/discovery-${{ gitea.run_id }}-${{ gitea.run_attempt }}
      PLATFORM_PRIVATE_DIR: /run/platform-jobs
    steps:
      - name: Record discovery start
        run: python3 /opt/platform/scripts/discovery_health.py start
      - name: Prepare a fresh result workspace
        run: python3 /opt/platform/scripts/workspace.py
      - name: Checkout the local Gitea run revision
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          github-server-url: ${{ gitea.server_url }}
          ref: ${{ gitea.sha }}
          persist-credentials: false
      - name: Discover native facts
        run: python3 scripts/discover.py
      - name: Reconcile collected infrastructure facts
        if: always()
        run: python3 scripts/reconcile_netbox.py "$PLATFORM_RESULTS_DIR"
      - name: Publish compact reconciliation result
        if: always()
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: reconciliation-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          path: ${{ env.PLATFORM_RESULTS_DIR }}/reconciliation-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish operator debugging facts (including partial failures)
        if: always()
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # Gitea-compatible v4 protocol
        with:
          name: discovery-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          path: |
            ${{ env.PLATFORM_RESULTS_DIR }}/summary.md
            ${{ env.PLATFORM_RESULTS_DIR }}/run.json
            ${{ env.PLATFORM_RESULTS_DIR }}/facts/*.json
            ${{ env.PLATFORM_RESULTS_DIR }}/dmi/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Record reconciliation and publication health
        if: always()
        env:
          PLATFORM_JOB_STATUS: ${{ job.status }}
        run: python3 /opt/platform/scripts/discovery_health.py finish
      - name: Remove local results after publication
        if: always()
        run: python3 /opt/platform/scripts/workspace.py --cleanup
      - name: Record final workflow status after cleanup
        if: always()
        env:
          PLATFORM_JOB_STATUS: ${{ job.status }}
        run: python3 /opt/platform/scripts/discovery_health.py complete
