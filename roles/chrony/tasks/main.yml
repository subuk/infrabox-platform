---
- name: Install chrony
  become: true
  ansible.builtin.dnf:
    name: chrony
    state: present
  tags: [chrony, install]
- name: Render desired chrony configuration
  become: true
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/chronyd -p -f %s
  notify: chrony restart
  tags: [chrony, configure]
- name: Inspect existing service units for first-install check mode
  ansible.builtin.service_facts:
  tags: [chrony, service]
- name: Enable and start chronyd
  become: true
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started
  when: not ansible_check_mode or 'chronyd.service' in ansible_facts.services
  tags: [chrony, service]
- name: Explain deferred service validation on first-install check
  ansible.builtin.debug:
    msg: chronyd is absent; installation/config diff is predicted, service validation awaits apply.
  when: ansible_check_mode and 'chronyd.service' not in ansible_facts.services
  tags: [chrony, verify]
