---
- name: Verify complete SSH configuration before reload
  listen: sshd reload
  become: true
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  check_mode: false
  changed_when: false
- name: Reload validated SSH settings
  listen: sshd reload
  become: true
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
